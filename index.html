<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <title>Gray-Scott</title>
    <style>
        /* 自定义滚动条样式 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(31, 41, 55, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.8);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 1);
        }
        
        /* 滑块样式优化 */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 2px;
        }
        
        /* 隐藏类 (用于折叠逻辑) */
        .sidebar-hidden {
            width: 0 !important;
            min-width: 0 !important;
            opacity: 0;
            padding: 0 !important;
            overflow: hidden;
        }
        
        /* 移动端侧边栏过渡 */
        @media (max-width: 768px) {
            .mobile-sidebar {
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                z-index: 50;
                width: 85% !important;
                transform: translateX(0);
                transition: transform 0.3s ease-in-out;
            }
            .mobile-sidebar.translate-x-full {
                transform: translateX(100%);
            }
        }
    </style>
</head>
<body class="h-full bg-gray-950 text-white m-0 p-0 overflow-hidden font-sans">
    
    <div class="flex h-full relative">
        
        <!-- 左侧画布区域 -->
        <div id="canvas-container" class="flex-1 relative h-full overflow-hidden bg-black transition-all duration-300">
            <canvas id="myCanvas" class="block w-full h-full cursor-crosshair outline-none"></canvas>

            <!-- 折叠/展开按钮 (悬浮) -->
            <button id="toggleSidebarBtn" class="absolute top-4 right-4 z-40 bg-gray-800 hover:bg-gray-700 text-white p-2 rounded-lg shadow-lg border border-gray-600 transition-colors focus:outline-none">
                <svg id="menuIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- 右侧控制面板 (Desktop: 30% width, Mobile: Drawer) -->
        <div id="sidebar" class="w-[30%] min-w-[320px] bg-gray-900 border-l border-gray-800 flex flex-col h-full shadow-2xl transition-all duration-300 ease-in-out custom-scrollbar mobile-sidebar translate-x-full md:translate-x-0">
            
            <!-- 面板头部 -->
            <div class="p-5 border-b border-gray-800 flex items-center justify-between bg-gray-900 sticky top-0 z-10">
                <h2 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">控制器</h2>
                <!-- 移动端关闭按钮 -->
                <button id="closeMobileSidebar" class="md:hidden text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- 可滚动内容区 -->
            <div class="flex-1 overflow-y-auto p-5 space-y-6">
                
                <!-- 1. 操作按钮组 -->
                <div class="grid grid-cols-2 gap-2">
                    <button id="resetBtn" class="bg-gray-800 hover:bg-gray-700 hover:text-green-400 border border-gray-700 text-gray-300 px-3 py-2 rounded-lg transition-all flex flex-col items-center justify-center gap-1 text-xs font-medium group">
                        <svg class="w-5 h-5 mb-1 group-hover:rotate-180 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        重置模拟
                    </button>
                    <button id="resetColorsBtn" class="bg-gray-800 hover:bg-gray-700 hover:text-purple-400 border border-gray-700 text-gray-300 px-3 py-2 rounded-lg transition-all flex flex-col items-center justify-center gap-1 text-xs font-medium group">
                        <svg class="w-5 h-5 mb-1 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                        </svg>
                        重置颜色
                    </button>
                </div>

                <!-- 2. 参数设置 -->
                <div class="space-y-4">
                    <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">核心参数</h3>
                    
                    <!-- 预设选择 -->
                    <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                        <label class="block text-sm font-medium text-gray-300 mb-2">参数预设</label>
                        <div class="relative">
                            <select id="presetSelect" class="w-full bg-gray-900 text-white pl-3 pr-10 py-2.5 rounded-lg border border-gray-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none appearance-none cursor-pointer transition-colors">
                                <option value="0">Default</option>
                                <option value="1">Solitons</option>
                                <option value="2">Pulsating solitons</option>
                                <option value="3">Worms</option>
                                <option value="4">Mazes</option>
                                <option value="5">Holes</option>
                                <option value="6">Chaos</option>
                                <option value="7">Chaos and holes</option>
                                <option value="8">Moving spots</option>
                                <option value="9">Spots and loops</option>
                                <option value="10">Waves</option>
                                <option value="11">The U-Skate World</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none text-gray-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Feed 参数 -->
                    <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50 space-y-3">
                        <div class="flex justify-between items-center">
                            <label class="text-sm font-medium text-gray-300">Feed Rate (f)</label>
                            <span id="feedValue" class="text-xs font-mono bg-blue-900/30 text-blue-300 px-2 py-1 rounded">0.055</span>
                        </div>
                        <input type="range" id="feedSlider" min="0.01" max="0.1" step="0.001" value="0.055" class="w-full">
                    </div>

                    <!-- Kill 参数 -->
                    <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50 space-y-3">
                        <div class="flex justify-between items-center">
                            <label class="text-sm font-medium text-gray-300">Kill Rate (k)</label>
                            <span id="killValue" class="text-xs font-mono bg-red-900/30 text-red-300 px-2 py-1 rounded">0.062</span>
                        </div>
                        <input type="range" id="killSlider" min="0.04" max="0.07" step="0.001" value="0.062" class="w-full">
                    </div>
                </div>

                <!-- 3. 颜色控制 -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">颜色映射</h3>
                    </div>
                    
                    <div id="colorControls" class="space-y-3">
                        <!-- 动态生成的颜色控件将放在这里 -->
                    </div>
                </div>
            </div>
            
            <!-- 底部版权或状态 -->
            <div class="p-4 border-t border-gray-800 text-xs text-gray-500 text-center bg-gray-900">
                Gray-Scott Reaction-Diffusion
            </div>
        </div>

        <!-- 移动端遮罩 (点击可关闭侧边栏) -->
        <div id="mobileOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-30 hidden md:hidden transition-opacity"></div>
    </div>

    <script type="module">
        import { init, reset, fullScreen, setFeed, setKill, setColor, setColors, resetColors, setPreset, resize } from './index.js';
        
        // 默认颜色配置
        const defaultColors = [
            { r: 0, g: 0, b: 0, threshold: 0.0 },
            { r: 0, g: 1, b: 0, threshold: 0.2 },
            { r: 1, g: 1, b: 0, threshold: 0.21 },
            { r: 1, g: 0, b: 0, threshold: 0.4 },
            { r: 1, g: 1, b: 1, threshold: 0.6 }
        ];
        
        const createColorControls = () => {
            const container = document.getElementById('colorControls');
            container.innerHTML = '';
            
            defaultColors.forEach((color, index) => {
                const colorDiv = document.createElement('div');
                colorDiv.className = 'bg-gray-800 p-3 rounded-lg border border-gray-700 hover:border-gray-600 transition-colors';
                
                // 头部：预览和标题
                const header = document.createElement('div');
                header.className = 'flex items-center gap-3 mb-3';
                
                const preview = document.createElement('div');
                preview.className = 'w-6 h-6 rounded shadow-sm border border-gray-600';
                preview.style.backgroundColor = `rgb(${Math.floor(color.r * 255)}, ${Math.floor(color.g * 255)}, ${Math.floor(color.b * 255)})`;
                
                const title = document.createElement('span');
                title.className = 'text-xs font-medium text-gray-300';
                title.textContent = `阶段 ${index + 1}`;
                
                header.appendChild(preview);
                header.appendChild(title);
                
                // 控制区
                const controlsGrid = document.createElement('div');
                controlsGrid.className = 'grid gap-2';
                
                // 辅助函数：创建滑块
                const createSlider = (label, value, max, onChange) => {
                    const wrap = document.createElement('div');
                    wrap.className = 'flex items-center gap-2';
                    
                    const lbl = document.createElement('span');
                    lbl.className = 'text-[10px] text-gray-500 w-3 font-bold';
                    lbl.textContent = label;
                    
                    const inp = document.createElement('input');
                    inp.type = 'range';
                    inp.min = '0';
                    inp.max = max;
                    inp.step = '0.01';
                    inp.value = value;
                    inp.className = 'flex-1 h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer hover:bg-gray-600';
                    
                    inp.addEventListener('input', onChange);
                    wrap.appendChild(lbl);
                    wrap.appendChild(inp);
                    return { wrap, inp };
                };
                
                const updateColor = () => {
                    const r = parseFloat(rSlider.inp.value);
                    const g = parseFloat(gSlider.inp.value);
                    const b = parseFloat(bSlider.inp.value);
                    const t = parseFloat(tSlider.inp.value);
                    
                    preview.style.backgroundColor = `rgb(${Math.floor(r * 255)}, ${Math.floor(g * 255)}, ${Math.floor(b * 255)})`;
                    setColor(index + 1, r, g, b, t);
                };
                
                const rSlider = createSlider('R', color.r, '1', updateColor);
                const gSlider = createSlider('G', color.g, '1', updateColor);
                const bSlider = createSlider('B', color.b, '1', updateColor);
                const tSlider = createSlider('T', color.threshold, '1', updateColor); // T for Threshold
                
                controlsGrid.appendChild(rSlider.wrap);
                controlsGrid.appendChild(gSlider.wrap);
                controlsGrid.appendChild(bSlider.wrap);
                controlsGrid.appendChild(tSlider.wrap);
                
                colorDiv.appendChild(header);
                colorDiv.appendChild(controlsGrid);
                container.appendChild(colorDiv);
            });
        };
        
        // 侧边栏和响应式逻辑
        const initUI = () => {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleSidebarBtn');
            const closeMobileBtn = document.getElementById('closeMobileSidebar');
            const mobileOverlay = document.getElementById('mobileOverlay');
            const canvasContainer = document.getElementById('canvas-container');
            
            const isMobile = () => window.innerWidth < 768;
            
            // 更新画布尺寸
            const updateCanvasSize = () => {
                const width = canvasContainer.clientWidth;
                const height = canvasContainer.clientHeight;
                resize(width, height);
            };

            // 切换侧边栏状态
            const toggleSidebar = () => {
                const mobile = isMobile();
                if (mobile) {
                    // 移动端：使用 transform
                    const isClosed = sidebar.classList.contains('translate-x-full');
                    if (isClosed) {
                        sidebar.classList.remove('translate-x-full');
                        mobileOverlay.classList.remove('hidden');
                    } else {
                        sidebar.classList.add('translate-x-full');
                        mobileOverlay.classList.add('hidden');
                    }
                } else {
                    // 桌面端：使用 width/display，并配合 resize
                    sidebar.classList.toggle('sidebar-hidden');
                    
                    // 等待 CSS 动画完成后调整 Canvas 大小
                    setTimeout(() => {
                        updateCanvasSize();
                    }, 310); // 略大于 transition duration
                }
            };
            
            toggleBtn.addEventListener('click', toggleSidebar);
            closeMobileBtn.addEventListener('click', toggleSidebar);
            mobileOverlay.addEventListener('click', toggleSidebar);
            
            // 窗口大小改变时适配
            window.addEventListener('resize', () => {
                updateCanvasSize();
                
                // 重置某些响应式状态
                if (!isMobile()) {
                    mobileOverlay.classList.add('hidden');
                    // 确保桌面端如果是打开状态，移除 transform
                    sidebar.classList.remove('translate-x-full'); 
                } else {
                    // 移动端默认关闭
                    sidebar.classList.add('translate-x-full');
                    sidebar.classList.remove('sidebar-hidden');
                }
            });
        };

        const initApp = () => {
            // 初始化计算核心
            init();
            
            // 初始化 UI 逻辑
            initUI();
            createColorControls();
            
            // 绑定核心按钮
         
            document.getElementById('resetBtn').addEventListener('click', reset);
            document.getElementById('resetColorsBtn').addEventListener('click', () => {
                resetColors();
                createColorControls();
            });
            
            // 预设和参数绑定
            const presetSelect = document.getElementById('presetSelect');
            const feedSlider = document.getElementById('feedSlider');
            const killSlider = document.getElementById('killSlider');
            const feedValue = document.getElementById('feedValue');
            const killValue = document.getElementById('killValue');
            
            presetSelect.addEventListener('change', (e) => {
                const presetIndex = parseInt(e.target.value);
                setPreset(presetIndex);
                const currentPreset = window.PRESETS ? window.PRESETS[presetIndex] : null;
                if (currentPreset) {
                    feedSlider.value = currentPreset.feed;
                    killSlider.value = currentPreset.kill;
                    feedValue.textContent = currentPreset.feed.toFixed(3);
                    killValue.textContent = currentPreset.kill.toFixed(3);
                }
            });
            
            feedSlider.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                feedValue.textContent = value.toFixed(3);
                setFeed(value);
                presetSelect.selectedIndex = -1;
            });
            
            killSlider.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                killValue.textContent = value.toFixed(3);
                setKill(value);
                presetSelect.selectedIndex = -1;
            });
            
            // 初始 resize 确保填充
            setTimeout(() => {
                const canvasContainer = document.getElementById('canvas-container');
                resize(canvasContainer.clientWidth, canvasContainer.clientHeight);
            }, 100);
        };
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
